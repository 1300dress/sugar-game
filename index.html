<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUGAR — World Visual Test</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=block" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #d6cebe;
  }

  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    image-rendering: pixelated;
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
// ==================================================
// SPRITE DATA (GAME_BIBLE §18, §19)
// ==================================================

// Rendering scale only. Source PNGs are never resized.
// Per-state values make the ant read as the same body size in every
// state (idle 0.40 is the reference; matched on abdomen/body size).
const SPRITE_SCALE = {
  idle: 0.40,
  walk: 0.477,  // 0.53 x 0.9 (director request)
  run: 0.44,
  turn: 0.44,
  interact: 0.40,
  dead: 0.40
};

const ANIMATIONS = {
  idle:     { count: 2, interval: 400, anchorX: 172, anchorY: 93,  loop: true  },
  walk:     { count: 4, interval: 130, anchorX: 136, anchorY: 84,  loop: true  },
  run:      { count: 4, interval: 90,  anchorX: 162, anchorY: 95,  loop: true  },
  turn:     { count: 2, interval: 300, anchorX: 87,  anchorY: 105, loop: false },
  interact: { count: 3, interval: 280, anchorX: 188, anchorY: 95,  loop: false },
  dead:     { count: 2, interval: 450, anchorX: 104, anchorY: 101, loop: false }
};

for (const [name, anim] of Object.entries(ANIMATIONS)) {
  anim.frames = [];
  for (let i = 1; i <= anim.count; i++) {
    anim.frames.push(`sprites/${name}/${name}_${String(i).padStart(2, "0")}.png`);
  }
}

// Movement speed in screen pixels per second
const WALK_SPEED = 70;
const RUN_SPEED = 170;

// turn frame mapping (index into ANIMATIONS.turn.images)
// turn_01: larger, darker eyes and shorter abdomen -> faces the viewer
// turn_02: smaller eyes and longer abdomen -> faces away
const TURN_FRONT = 0;   // ArrowDown / S
const TURN_BACK = 1;    // ArrowUp / W

// ==================================================
// CANVAS
// ==================================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let DPR = 1;

function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  // resizing the canvas resets context state, so set this every time
  ctx.imageSmoothingEnabled = false;
}

window.addEventListener("resize", resize);
resize();

// ==================================================
// ASSET LOADING
// ==================================================

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("Failed to load " + src));
    img.src = src;
  });
}

async function loadAnimations() {
  for (const anim of Object.values(ANIMATIONS)) {
    anim.images = await Promise.all(anim.frames.map(loadImage));
  }
}

const CRUMB_FILES = [];
for (let i = 1; i <= 8; i++) {
  CRUMB_FILES.push(`sprites/objects/crumb_${String(i).padStart(2, "0")}.png`);
}
let crumbImages = [];

async function loadObjects() {
  crumbImages = await Promise.all(CRUMB_FILES.map(loadImage));
}

// ==================================================
// WORLD (GAME_BIBLE §6)
// Procedural paper only: nothing here is hand-drawn art.
// Built once per resize into an offscreen canvas, then
// drawn with a single drawImage per frame.
// ==================================================

const PAPER_COLOR = [214, 206, 190];   // faded sepia paper
const PAPER_PIXEL = 3;                 // paper is built at 1/3 res, then enlarged
const WORLD_SEED = 1017;               // same layout on every load

// small seeded RNG so dust and crumbs don't jump on reload
function makeRng(seed) {
  return function () {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const world = document.createElement("canvas");
const wctx = world.getContext("2d");

function buildPaper(rand, pw, ph) {
  const paper = document.createElement("canvas");
  paper.width = pw;
  paper.height = ph;
  const p = paper.getContext("2d");

  // base tone + per-pixel grain
  const img = p.createImageData(pw, ph);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (rand() - 0.5) * 22;
    d[i]     = PAPER_COLOR[0] + n;
    d[i + 1] = PAPER_COLOR[1] + n;
    d[i + 2] = PAPER_COLOR[2] + n * 0.9;
    d[i + 3] = 255;
  }
  p.putImageData(img, 0, 0);

  // uneven print density: tiny random grids blown up smoothly
  p.imageSmoothingEnabled = true;
  p.globalCompositeOperation = "multiply";
  for (const [gw, alpha] of [[7, 0.22], [19, 0.14]]) {
    const gh = Math.max(2, Math.round(gw * ph / pw));
    const blot = document.createElement("canvas");
    blot.width = gw;
    blot.height = gh;
    const b = blot.getContext("2d");
    for (let y = 0; y < gh; y++) {
      for (let x = 0; x < gw; x++) {
        const v = 150 + Math.floor(rand() * 105);
        b.fillStyle = `rgb(${v},${v - 4},${v - 12})`;
        b.fillRect(x, y, 1, 1);
      }
    }
    p.globalAlpha = alpha;
    p.drawImage(blot, 0, 0, pw, ph);
  }

  // scanner streaks
  p.globalCompositeOperation = "source-over";
  for (let i = 0; i < 9; i++) {
    const dark = rand() < 0.6;
    p.globalAlpha = 0.03 + rand() * 0.05;
    p.fillStyle = dark ? "#3b3026" : "#f4efe4";
    p.fillRect(0, Math.floor(rand() * ph), pw, 1 + Math.floor(rand() * 2));
  }
  p.globalAlpha = 0.04;
  p.fillStyle = "#3b3026";
  p.fillRect(Math.floor(pw * (0.15 + rand() * 0.7)), 0, 2, ph);

  // dust specks, dark and light
  for (let i = 0; i < pw * ph / 260; i++) {
    const dark = rand() < 0.75;
    p.globalAlpha = 0.25 + rand() * 0.5;
    p.fillStyle = dark ? "#2a221b" : "#fbf8f1";
    const s = rand() < 0.85 ? 1 : 2;
    p.fillRect(Math.floor(rand() * pw), Math.floor(rand() * ph), s, s);
  }

  return paper;
}

function buildWorld() {
  const rand = makeRng(WORLD_SEED);
  world.width = canvas.width;
  world.height = canvas.height;

  // 1. paper, enlarged with hard pixel edges
  const paper = buildPaper(rand,
    Math.ceil(W / PAPER_PIXEL), Math.ceil(H / PAPER_PIXEL));
  wctx.imageSmoothingEnabled = false;
  wctx.drawImage(paper, 0, 0, world.width, world.height);

  // 2. a few hairs / fibers caught on the scanner glass
  wctx.lineCap = "round";
  for (let i = 0; i < 4; i++) {
    let x = rand() * world.width;
    let y = rand() * world.height;
    let a = rand() * Math.PI * 2;
    wctx.globalAlpha = 0.18 + rand() * 0.2;
    wctx.strokeStyle = "#2a221b";
    wctx.lineWidth = Math.max(1, DPR * 0.8);
    wctx.beginPath();
    wctx.moveTo(x, y);
    const steps = 10 + Math.floor(rand() * 20);
    for (let s = 0; s < steps; s++) {
      a += (rand() - 0.5) * 0.6;
      x += Math.cos(a) * 5 * DPR;
      y += Math.sin(a) * 5 * DPR;
      wctx.lineTo(x, y);
    }
    wctx.stroke();
  }

  // 3. crumbs, printed into the paper (multiply) rather than pasted on top
  wctx.globalCompositeOperation = "multiply";
  const count = Math.max(6, Math.min(22, Math.round(W * H / 70000)));
  for (let i = 0; i < count; i++) {
    const img = crumbImages[Math.floor(rand() * crumbImages.length)];
    const s = (0.45 + rand() * 0.4) * DPR;
    wctx.save();
    wctx.globalAlpha = 0.7 + rand() * 0.3;
    wctx.translate(Math.round(rand() * world.width), Math.round(rand() * world.height));
    wctx.rotate(rand() * Math.PI * 2);
    wctx.scale(s, s);
    wctx.drawImage(img, -img.width / 2, -img.height / 2);
    wctx.restore();
  }

  // 4. vignette, like the edge of a scanner bed
  const cx = world.width / 2;
  const cy = world.height / 2;
  const r = Math.hypot(cx, cy);
  const g = wctx.createRadialGradient(cx, cy, r * 0.35, cx, cy, r);
  g.addColorStop(0, "rgba(255,255,255,0)");
  g.addColorStop(1, "rgba(92,74,56,0.55)");
  wctx.globalAlpha = 1;
  wctx.fillStyle = g;
  wctx.fillRect(0, 0, world.width, world.height);
  wctx.globalCompositeOperation = "source-over";
}

// Moving film grain drawn over everything, ant included,
// so the ant reads as part of the same print.
const GRAIN_FRAMES = [];
const GRAIN_INTERVAL = 80;
let grainIndex = 0;
let grainTime = 0;

function buildGrain() {
  const rand = makeRng(WORLD_SEED + 1);
  for (let f = 0; f < 4; f++) {
    const c = document.createElement("canvas");
    c.width = c.height = 96;
    const g = c.getContext("2d");
    const img = g.createImageData(96, 96);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const v = rand() < 0.5 ? 20 : 250;
      d[i] = v; d[i + 1] = v - 6; d[i + 2] = v - 14;
      d[i + 3] = Math.floor(rand() * 34);
    }
    g.putImageData(img, 0, 0);
    GRAIN_FRAMES.push(ctx.createPattern(c, "repeat"));
  }
}

function updateGrain(dt) {
  grainTime += dt;
  if (grainTime >= GRAIN_INTERVAL) {
    grainTime = 0;
    grainIndex = (grainIndex + 1) % GRAIN_FRAMES.length;
  }
}

function drawGrain() {
  const scale = 1.5 * DPR;   // grain dots are ~1.5 CSS px
  ctx.save();
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.fillStyle = GRAIN_FRAMES[grainIndex];
  ctx.fillRect(0, 0, canvas.width / scale, canvas.height / scale);
  // very slight exposure flicker
  ctx.globalAlpha = Math.random() * 0.025;
  ctx.fillStyle = "#1e1812";
  ctx.fillRect(0, 0, canvas.width / scale, canvas.height / scale);
  ctx.restore();
}

// ==================================================
// INPUT
// e.code is used so keys work regardless of keyboard
// language (Korean input mode turns e.key "a" into "ㅁ").
// ==================================================

const held = new Set();
const pressed = new Set();

const GAME_KEYS = new Set([
  "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown",
  "KeyA", "KeyD", "KeyW", "KeyS",
  "ShiftLeft", "ShiftRight", "KeyE",
  "KeyK"  // DEBUG: dead animation test only
]);

// Some setups (keyboard remappers, remote desktop, some IMEs) send
// key events with an empty e.code. Fall back to e.key, then keyCode.
const KEY_FALLBACK = {
  arrowleft: "ArrowLeft", arrowright: "ArrowRight",
  arrowup: "ArrowUp", arrowdown: "ArrowDown",
  a: "KeyA", d: "KeyD", w: "KeyW", s: "KeyS", e: "KeyE", k: "KeyK",
  "ㅁ": "KeyA", "ㅇ": "KeyD", "ㅈ": "KeyW", "ㄴ": "KeyS", "ㄷ": "KeyE", "ㅏ": "KeyK",
  shift: "ShiftLeft"
};
const KEYCODE_FALLBACK = {
  37: "ArrowLeft", 38: "ArrowUp", 39: "ArrowRight", 40: "ArrowDown",
  65: "KeyA", 68: "KeyD", 87: "KeyW", 83: "KeyS", 69: "KeyE", 75: "KeyK",
  16: "ShiftLeft"
};

function keyId(e) {
  if (e.code) return e.code;
  return KEY_FALLBACK[(e.key || "").toLowerCase()] || KEYCODE_FALLBACK[e.keyCode] || "";
}

window.addEventListener("keydown", e => {
  const id = keyId(e);
  if (!GAME_KEYS.has(id)) return;
  e.preventDefault();
  if (!held.has(id)) pressed.add(id);
  held.add(id);
});

window.addEventListener("keyup", e => {
  held.delete(keyId(e));
});

window.addEventListener("blur", () => held.clear());

function axis(neg, pos) {
  const n = neg.some(k => held.has(k)) ? 1 : 0;
  const p = pos.some(k => held.has(k)) ? 1 : 0;
  return p - n;
}

// ==================================================
// PLAYER
// ==================================================

const player = {
  // world position of the BODY anchor
  x: 0,
  y: 0,
  facing: -1,   // -1 = left (sprite default), 1 = right (flipped)
  anim: "idle",
  frame: 0,
  frameTime: 0,
  finished: false
};

function setAnim(name) {
  if (player.anim === name) return;
  player.anim = name;
  player.frame = 0;
  player.frameTime = 0;
  player.finished = false;
}

function updateAnimation(dt) {
  const anim = ANIMATIONS[player.anim];
  player.frameTime += dt;

  while (player.frameTime >= anim.interval) {
    player.frameTime -= anim.interval;
    if (anim.loop) {
      player.frame = (player.frame + 1) % anim.count;
    } else if (player.frame < anim.count - 1) {
      player.frame++;
    } else {
      // hold the last frame for one full interval, then report done
      player.finished = true;
      player.frameTime = 0;
    }
  }
}

// Priority: DEAD > INTERACT > RUN > WALK > TURN > IDLE
function updatePlayer(dt) {
  const dx = axis(["ArrowLeft", "KeyA"], ["ArrowRight", "KeyD"]);
  const dy = axis(["ArrowUp", "KeyW"], ["ArrowDown", "KeyS"]);
  const running = held.has("ShiftLeft") || held.has("ShiftRight");

  // ---- DEAD: final state, ignores all input until page refresh
  if (player.anim === "dead") return;

  // DEBUG: K plays the dead animation for sprite checking only.
  // Not a game mechanic. Remove when a real death trigger exists.
  if (pressed.has("KeyK")) {
    setAnim("dead");
    return;
  }

  // ---- INTERACT: plays once, movement ignored until it finishes
  if (player.anim === "interact") {
    if (player.finished) setAnim("idle");
    else return;
  }
  if (pressed.has("KeyE")) {
    setAnim("interact");
    return;
  }

  // ---- RUN / WALK: horizontal only. Right = mirrored left sprite.
  if (dx !== 0) {
    player.facing = dx;
    const speed = running ? RUN_SPEED : WALK_SPEED;
    player.x += dx * speed * dt / 1000;
    setAnim(running ? "run" : "walk");

    // keep the body on screen
    const margin = 40;
    player.x = Math.max(margin, Math.min(W - margin, player.x));
    return;
  }

  // ---- TURN: up/down only changes the view, no Y movement yet
  if (dy !== 0) {
    setAnim("turn");
    player.frame = dy < 0 ? TURN_BACK : TURN_FRONT;
    player.frameTime = 0;  // hold the frame while the key is down
    return;
  }

  // ---- IDLE
  setAnim("idle");
}

// ==================================================
// DRAW
// ==================================================

function drawPlayer() {
  const anim = ANIMATIONS[player.anim];
  const img = anim.images[player.frame];

  // anchor position snapped to whole device pixels
  const ax = Math.round(player.x * DPR);
  const ay = Math.round(player.y * DPR);
  const s = SPRITE_SCALE[player.anim] * DPR;

  // turn frames are a front/back view and are never mirrored
  const flip = player.facing === 1 && player.anim !== "turn";

  ctx.save();
  ctx.translate(ax, ay);
  ctx.scale(flip ? -s : s, s);
  // BODY anchor sits exactly on (player.x, player.y)
  ctx.drawImage(img, -anim.anchorX, -anim.anchorY);
  ctx.restore();
}

// ==================================================
// INTRO TITLE SEQUENCE (GAME_BIBLE §29)
// ?intro=0 skips the intro. Any key or click jumps to the reveal.
// ==================================================

// ink tones from the title concepts page
const INK = [42, 34, 27];
const GHOST = [128, 104, 78];
const CREDIT_INK = [92, 74, 56];

const introEnabled = new URLSearchParams(location.search).get("intro") !== "0";

// title cuts out hard, the credit dissolves into the ant world
const intro = {
  active: introEnabled,
  phase: 0,
  time: 0,
  phases: [
    ["blank", 600],
    ["title", 2200],
    ["gap", 1300],
    ["credit", 1800],
    ["reveal", 1000]
  ]
};

// --- 1-bit text masks (same method as intro_concepts.html)

function rasterText(str, family, size) {
  const font = `${size}px "${family}"`;
  const c = document.createElement("canvas");
  const x = c.getContext("2d");
  x.font = font;
  c.width = Math.ceil(x.measureText(str).width + size * 2);
  c.height = size * 2;
  x.font = font;
  x.fillText(str, size * 0.5, Math.round(size * 1.4));
  const d = x.getImageData(0, 0, c.width, c.height).data;

  let minX = c.width, minY = c.height, maxX = -1, maxY = -1;
  for (let y = 0; y < c.height; y++) {
    for (let px = 0; px < c.width; px++) {
      if (d[(y * c.width + px) * 4 + 3] >= 128) {
        minX = Math.min(minX, px); maxX = Math.max(maxX, px);
        minY = Math.min(minY, y); maxY = Math.max(maxY, y);
      }
    }
  }
  const w = maxX - minX + 1, h = maxY - minY + 1;
  const m = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let px = 0; px < w; px++) {
      m[y * w + px] = d[((y + minY) * c.width + px + minX) * 4 + 3] >= 128 ? 1 : 0;
    }
  }
  return { w, h, d: m };
}

// one line of worn print: ghost ink 1px down-right, ink on top,
// then knocked out in soft clumps. Returned at grid resolution.
function inkLine(str, size, wearAmount, seed, color = INK) {
  const m = rasterText(str, "VT323", size);
  const w = m.w + 1, h = m.h + 1;
  const data = new Uint8ClampedArray(w * h * 4);
  const paint = (ox, oy, c) => {
    for (let y = 0; y < m.h; y++) {
      for (let x = 0; x < m.w; x++) {
        if (!m.d[y * m.w + x]) continue;
        const i = ((y + oy) * w + x + ox) * 4;
        data[i] = c[0]; data[i + 1] = c[1]; data[i + 2] = c[2]; data[i + 3] = 255;
      }
    }
  };
  paint(1, 1, GHOST);
  paint(0, 0, color);

  const rand = makeRng(seed);
  const cell = 3;
  const cw = Math.ceil(w / cell) + 1;
  const coarse = new Float32Array(cw * (Math.ceil(h / cell) + 1)).map(() => rand());
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      if (!data[i + 3]) continue;
      const c = coarse[Math.floor(y / cell) * cw + Math.floor(x / cell)];
      if (rand() < wearAmount * c * c * 2.2) data[i + 3] = 0;
    }
  }

  const canvasLine = document.createElement("canvas");
  canvasLine.width = w;
  canvasLine.height = h;
  canvasLine.getContext("2d").putImageData(new ImageData(data, w, h), 0, 0);
  return canvasLine;
}

// --- layers, rebuilt on resize

const paperLayer = document.createElement("canvas");
const titleLayer = document.createElement("canvas");
const creditLayer = document.createElement("canvas");
const revealLayer = document.createElement("canvas");
const scratch = document.createElement("canvas");

function blit(target, src, x, y, pw, ph) {
  const t = target.getContext("2d");
  t.imageSmoothingEnabled = false;
  t.drawImage(src, Math.round(x), Math.round(y), src.width * pw, src.height * ph);
}

function snap(v, pix) {
  return Math.round(v / pix) * pix;
}

// three equal lines: no word outranks another
function layoutTitle(cw, ch) {
  const lines = ["SUGAR /", "HONEY /", "ICED TEA"].map((s, i) => inkLine(s, 36, 0.3, 177 + i));
  const lh = Math.max(...lines.map(l => l.height));
  const gap = Math.round(lh * 0.22);
  const maxW = Math.max(...lines.map(l => l.width));
  const pix = Math.max(1, Math.floor(Math.min(
    ch * 0.9 / (lh * 3 + gap * 2),
    cw * 0.9 / maxW)));
  titleLayer.width = cw;
  titleLayer.height = ch;
  let y = snap((ch - (lh * 3 + gap * 2) * pix) / 2, pix);
  for (const line of lines) {
    blit(titleLayer, line, snap((cw - line.width * pix) / 2, pix), y, pix, pix);
    y += (lh + gap) * pix;
  }
}

function buildIntro() {
  if (!introEnabled) return;
  const cw = canvas.width, ch = canvas.height;

  // same seed and size as the world paper, so the reveal only
  // brings in the ant, crumbs and hairs; the paper itself stays put
  paperLayer.width = cw;
  paperLayer.height = ch;
  const p = paperLayer.getContext("2d");
  p.imageSmoothingEnabled = false;
  p.drawImage(buildPaper(makeRng(WORLD_SEED), Math.ceil(W / PAPER_PIXEL), Math.ceil(H / PAPER_PIXEL)), 0, 0, cw, ch);
  const r = Math.hypot(cw / 2, ch / 2);
  const g = p.createRadialGradient(cw / 2, ch / 2, r * 0.35, cw / 2, ch / 2, r);
  g.addColorStop(0, "rgba(255,255,255,0)");
  g.addColorStop(1, "rgba(92,74,56,0.55)");
  // multiply, exactly like the world vignette, or the dissolve shows seams
  p.globalCompositeOperation = "multiply";
  p.fillStyle = g;
  p.fillRect(0, 0, cw, ch);
  p.globalCompositeOperation = "source-over";

  layoutTitle(cw, ch);

  // creator credit: small, short, same worn ink
  const credit = inkLine("@1300dress", 22, 0.15, 311, CREDIT_INK);
  const cpix = Math.max(1, Math.round(ch * 0.055 / credit.height));
  creditLayer.width = cw;
  creditLayer.height = ch;
  blit(creditLayer, credit,
    snap((cw - credit.width * cpix) / 2, cpix),
    snap((ch - credit.height * cpix) / 2, cpix), cpix, cpix);

  revealLayer.width = cw;
  revealLayer.height = ch;
  const rv = revealLayer.getContext("2d");
  rv.drawImage(paperLayer, 0, 0);
  rv.drawImage(creditLayer, 0, 0);

  scratch.width = cw;
  scratch.height = ch;
}

// --- dissolves

const dissolveMask = document.createElement("canvas");
let dissolveCell = 0;
let dissolveThresholds = null;

function prepareMask(cell) {
  if (cell === dissolveCell && dissolveMask.width === Math.ceil(canvas.width / cell)) return;
  dissolveCell = cell;
  dissolveMask.width = Math.ceil(canvas.width / cell);
  dissolveMask.height = Math.ceil(canvas.height / cell);
  const rand = makeRng(WORLD_SEED + 9);
  dissolveThresholds = new Float32Array(dissolveMask.width * dissolveMask.height).map(() => rand());
}

// coarse pixel dissolve: draw src with `amount` (0..1) of its blocks gone
function drawDissolved(src, amount) {
  if (amount <= 0) {
    ctx.drawImage(src, 0, 0);
    return;
  }
  if (amount >= 1) return;

  const cell = Math.round(10 * DPR);
  prepareMask(cell);
  const m = dissolveMask.getContext("2d");
  const img = m.createImageData(dissolveMask.width, dissolveMask.height);
  for (let i = 0; i < dissolveThresholds.length; i++) {
    img.data[i * 4 + 3] = dissolveThresholds[i] >= amount ? 255 : 0;
  }
  m.putImageData(img, 0, 0);

  const s = scratch.getContext("2d");
  s.globalCompositeOperation = "source-over";
  s.clearRect(0, 0, scratch.width, scratch.height);
  s.drawImage(src, 0, 0);
  s.globalCompositeOperation = "destination-in";
  s.imageSmoothingEnabled = false;
  s.drawImage(dissolveMask, 0, 0, dissolveMask.width * cell, dissolveMask.height * cell);
  s.globalCompositeOperation = "source-over";
  ctx.drawImage(scratch, 0, 0);
}

function skipIntro() {
  if (!intro.active) return;
  const reveal = intro.phases.findIndex(([name]) => name === "reveal");
  if (intro.phase < reveal) {
    intro.phase = reveal;
    intro.time = 0;
  }
}

window.addEventListener("keydown", skipIntro);
window.addEventListener("pointerdown", skipIntro);

function updateIntro(dt) {
  intro.time += dt;
  while (intro.active && intro.time >= intro.phases[intro.phase][1]) {
    intro.time -= intro.phases[intro.phase][1];
    intro.phase++;
    if (intro.phase >= intro.phases.length) intro.active = false;
  }
}

function drawIntro() {
  const [name, dur] = intro.phases[intro.phase];
  if (name === "reveal") {
    drawDissolved(revealLayer, intro.time / dur);
    return;
  }
  ctx.drawImage(paperLayer, 0, 0);
  if (name === "title") ctx.drawImage(titleLayer, 0, 0);
  if (name === "credit") ctx.drawImage(creditLayer, 0, 0);
}

// ==================================================
// LOOP
// ==================================================

let lastTime = 0;

function loop(time) {
  const dt = lastTime ? Math.min(time - lastTime, 100) : 0;
  lastTime = time;

  // the ant stays put (idle) until the intro has handed over
  if (intro.active) updateIntro(dt);
  else updatePlayer(dt);
  pressed.clear();
  updateAnimation(dt);

  updateGrain(dt);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(world, 0, 0);
  drawPlayer();
  if (intro.active) drawIntro();
  drawGrain();

  requestAnimationFrame(loop);
}

// Make sure the page has keyboard focus from load, and after any click
canvas.tabIndex = 0;
canvas.style.outline = "none";
canvas.focus();
window.addEventListener("pointerdown", () => canvas.focus());

// Build stamp: lets you confirm in DevTools that the browser is not
// running a cached older index.html
console.info("[SUGAR] build: intro-sequence-02");

// title font; give up after 3s so a slow network never blocks the game
const introFont = Promise.race([
  document.fonts.load('36px "VT323"'),
  new Promise(r => setTimeout(r, 3000))
]);

Promise.all([loadAnimations(), loadObjects(), introFont])
  .then(() => {
    buildGrain();
    buildWorld();
    buildIntro();
    window.addEventListener("resize", buildWorld);
    window.addEventListener("resize", buildIntro);
    // initial spawn only; never reset inside the loop
    player.x = W / 2;
    player.y = H / 2;
    requestAnimationFrame(loop);
  })
  .catch(err => console.error(err));

// Read-only hook for automated checks
window.__ant = player;
</script>
