<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SUGAR — World Visual Test</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=block" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #d6cebe;
    /* phones: no scroll, pinch, double-tap zoom, long-press menu or tap flash */
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  canvas {
    display: block;
    position: fixed;
    left: 0;
    top: 0;
    /* real size is set in resize(): 100vh is taller than the visible
       area on mobile browsers with a collapsing address bar */
    width: 100vw;
    height: 100vh;
    touch-action: none;
    image-rendering: pixelated;
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
// ==================================================
// SPRITE DATA (GAME_BIBLE §18, §19)
// ==================================================

// Rendering scale only. Source PNGs are never resized.
// Per-state values make the ant read as the same body size in every
// state (idle 0.40 is the reference; matched on abdomen/body size).
const SPRITE_SCALE = {
  idle: 0.40,
  walk: 0.477,  // 0.53 x 0.9 (director request)
  run: 0.44,
  turn: 0.44,
  front_walk: 0.44,
  back_walk: 0.44,
  interact: 0.40,
  dead: 0.40
};

const ANIMATIONS = {
  idle:     { count: 2, interval: 400, anchorX: 172, anchorY: 93,  loop: true  },
  walk:     { count: 4, interval: 130, anchorX: 136, anchorY: 84,  loop: true  },
  run:      { count: 4, interval: 90,  anchorX: 162, anchorY: 95,  loop: true  },
  turn:     { count: 2, interval: 300, anchorX: 87,  anchorY: 105, loop: false },
  interact: { count: 3, interval: 280, anchorX: 188, anchorY: 95,  loop: false },
  dead:     { count: 2, interval: 450, anchorX: 104, anchorY: 101, loop: false },
  // derived from turn_01 / turn_02 by tools/make_turn_walk.py (legs only);
  // same canvas as turn, so same anchor. runInterval is used with Shift.
  front_walk: { count: 4, interval: 130, runInterval: 90, anchorX: 87, anchorY: 105, loop: true },
  back_walk:  { count: 4, interval: 130, runInterval: 90, anchorX: 87, anchorY: 105, loop: true }
};

for (const [name, anim] of Object.entries(ANIMATIONS)) {
  anim.frames = [];
  for (let i = 1; i <= anim.count; i++) {
    anim.frames.push(`sprites/${name}/${name}_${String(i).padStart(2, "0")}.png`);
  }
}

// Animations seen from the front or back (never flipped)
const FRONT_BACK = new Set(["turn", "front_walk", "back_walk"]);

// Movement speed in world pixels per second
// (original 70 / 170, x1.7 then x1.3, director request)
const WALK_SPEED = 155;
const RUN_SPEED = 375;

// ==================================================
// CANVAS
// ==================================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let DPR = 1;

function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  // resizing the canvas resets context state, so set this every time
  ctx.imageSmoothingEnabled = false;
}

window.addEventListener("resize", resize);
resize();

// ==================================================
// ASSET LOADING
// ==================================================

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("Failed to load " + src));
    img.src = src;
  });
}

// opaque bounds of a sprite in its own pixels, for touching things
function opaqueBox(img) {
  const c = document.createElement("canvas");
  c.width = img.width;
  c.height = img.height;
  const x = c.getContext("2d");
  x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height).data;
  let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
  for (let y = 0; y < c.height; y++) {
    for (let px = 0; px < c.width; px++) {
      if (d[(y * c.width + px) * 4 + 3] > 100) {
        x0 = Math.min(x0, px); x1 = Math.max(x1, px);
        y0 = Math.min(y0, y); y1 = Math.max(y1, y);
      }
    }
  }
  return { x0, y0, x1, y1 };
}

async function loadAnimations() {
  for (const anim of Object.values(ANIMATIONS)) {
    anim.images = await Promise.all(anim.frames.map(loadImage));
    anim.boxes = anim.images.map(opaqueBox);
  }
}

const CRUMB_FILES = [];
for (let i = 1; i <= 8; i++) {
  CRUMB_FILES.push(`sprites/objects/crumb_${String(i).padStart(2, "0")}.png`);
}
let crumbImages = [];
let starCandyImage = null;

async function loadObjects() {
  crumbImages = await Promise.all(CRUMB_FILES.map(loadImage));
  starCandyImage = await loadImage("sprites/objects/star_candy.png");
}

// ==================================================
// WORLD (GAME_BIBLE §6)
// Procedural paper only: nothing here is hand-drawn art.
// The floor is endless: it is cut into square chunks that are
// generated from their own coordinates the first time the camera
// sees them, so the same spot always looks the same.
// ==================================================

const PAPER_COLOR = [214, 206, 190];   // faded sepia paper
const PAPER_PIXEL = 3;                 // paper is built at 1/3 res, then enlarged
const WORLD_SEED = 1017;               // same layout on every load
const CHUNK = 480;                     // chunk size in CSS px (multiple of PAPER_PIXEL)
const CHUNK_GRID = CHUNK / PAPER_PIXEL;

// small seeded RNG so dust and crumbs don't jump on reload
function makeRng(seed) {
  return function () {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hash2(x, y, seed) {
  let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(seed, 2147483647);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

// smooth value noise in world space, so blotches run across chunk edges
function valueNoise(x, y, seed) {
  const ix = Math.floor(x), iy = Math.floor(y);
  let fx = x - ix, fy = y - iy;
  fx = fx * fx * (3 - 2 * fx);
  fy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy, seed), b = hash2(ix + 1, iy, seed);
  const c = hash2(ix, iy + 1, seed), d = hash2(ix + 1, iy + 1, seed);
  return (a + (b - a) * fx) + ((c + (d - c) * fx) - (a + (b - a) * fx)) * fy;
}

function buildChunk(cx, cy) {
  const rand = makeRng(Math.floor(hash2(cx, cy, WORLD_SEED) * 4294967296));
  const n = CHUNK_GRID;

  // 1. paper: grain + uneven print density, at 1/3 res
  const paper = document.createElement("canvas");
  paper.width = paper.height = n;
  const p = paper.getContext("2d");
  const img = p.createImageData(n, n);
  const d = img.data;
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      const gx = cx * n + x, gy = cy * n + y;
      // two blotch layers, multiplied in like the old smooth blow-ups
      const b1 = 150 + 105 * valueNoise(gx / 60, gy / 60, WORLD_SEED + 1);
      const b2 = 150 + 105 * valueNoise(gx / 22, gy / 22, WORLD_SEED + 2);
      const f = (1 - 0.22 + 0.22 * b1 / 255) * (1 - 0.14 + 0.14 * b2 / 255);
      const grain = (rand() - 0.5) * 22;
      const i = (y * n + x) * 4;
      d[i]     = (PAPER_COLOR[0] + grain) * f;
      d[i + 1] = (PAPER_COLOR[1] + grain) * f * 0.995;
      d[i + 2] = (PAPER_COLOR[2] + grain * 0.9) * f * 0.985;
      d[i + 3] = 255;
    }
  }
  p.putImageData(img, 0, 0);

  // scanner streaks: chosen per chunk row so they run straight across
  const rowRand = makeRng(Math.floor(hash2(0, cy, WORLD_SEED + 3) * 4294967296));
  const streaks = Math.floor(rowRand() * 4);
  for (let i = 0; i < streaks; i++) {
    p.globalAlpha = 0.03 + rowRand() * 0.05;
    p.fillStyle = rowRand() < 0.6 ? "#3b3026" : "#f4efe4";
    p.fillRect(0, Math.floor(rowRand() * n), n, 1 + Math.floor(rowRand() * 2));
  }
  // a rare vertical band, chosen per chunk column
  const colRand = makeRng(Math.floor(hash2(cx, 0, WORLD_SEED + 4) * 4294967296));
  if (colRand() < 0.2) {
    p.globalAlpha = 0.04;
    p.fillStyle = "#3b3026";
    p.fillRect(Math.floor(colRand() * n), 0, 2, n);
  }

  // dust specks, dark and light
  for (let i = 0; i < n * n / 260; i++) {
    p.globalAlpha = 0.25 + rand() * 0.5;
    p.fillStyle = rand() < 0.75 ? "#2a221b" : "#fbf8f1";
    const sz = rand() < 0.85 ? 1 : 2;
    p.fillRect(Math.floor(rand() * n), Math.floor(rand() * n), sz, sz);
  }
  p.globalAlpha = 1;

  // 2. decor, drawn live on top (CSS px, relative to the chunk)
  const hairs = [];
  if (rand() < 0.3) {
    // starts near the middle so it never crosses the chunk edge
    let x = CHUNK * (0.3 + rand() * 0.4);
    let y = CHUNK * (0.3 + rand() * 0.4);
    let a = rand() * Math.PI * 2;
    const pts = [[x, y]];
    const steps = 10 + Math.floor(rand() * 20);
    for (let s = 0; s < steps; s++) {
      a += (rand() - 0.5) * 0.6;
      x += Math.cos(a) * 5;
      y += Math.sin(a) * 5;
      pts.push([x, y]);
    }
    hairs.push({ pts, alpha: 0.18 + rand() * 0.2 });
  }

  const crumbs = [];
  const count = 2 + Math.floor(rand() * 4);
  for (let i = 0; i < count; i++) {
    crumbs.push({
      img: crumbImages[Math.floor(rand() * crumbImages.length)],
      x: 25 + rand() * (CHUNK - 50),
      y: 25 + rand() * (CHUNK - 50),
      s: 0.45 + rand() * 0.4,
      rot: rand() * Math.PI * 2,
      alpha: 0.7 + rand() * 0.3
    });
  }

  return { paper, hairs, crumbs };
}

const chunks = new Map();

function getChunk(cx, cy) {
  const key = cx + "," + cy;
  let c = chunks.get(key);
  if (!c) {
    c = buildChunk(cx, cy);
    chunks.set(key, c);
  }
  return c;
}

// camera = world position of the screen's top-left corner (CSS px)
const camera = { x: 0, y: 0 };

// draw the floor under the camera into target (device px)
function drawWorld(t, camX, camY, withDecor) {
  // snap the camera to whole device pixels so nothing shimmers
  const ox = Math.round(camX * DPR);
  const oy = Math.round(camY * DPR);
  const size = CHUNK * DPR;
  const cx0 = Math.floor(ox / size), cy0 = Math.floor(oy / size);
  const cx1 = Math.floor((ox + canvas.width) / size);
  const cy1 = Math.floor((oy + canvas.height) / size);

  t.imageSmoothingEnabled = false;
  for (let cy = cy0; cy <= cy1; cy++) {
    for (let cx = cx0; cx <= cx1; cx++) {
      t.drawImage(getChunk(cx, cy).paper, cx * size - ox, cy * size - oy, size, size);
    }
  }
  if (!withDecor) return;

  t.save();
  t.lineCap = "round";
  t.strokeStyle = "#2a221b";
  t.lineWidth = Math.max(1, DPR * 0.8);
  for (let cy = cy0; cy <= cy1; cy++) {
    for (let cx = cx0; cx <= cx1; cx++) {
      const c = getChunk(cx, cy);
      const bx = cx * size - ox, by = cy * size - oy;
      for (const h of c.hairs) {
        t.globalAlpha = h.alpha;
        t.beginPath();
        for (const [x, y] of h.pts) t.lineTo(bx + x * DPR, by + y * DPR);
        t.stroke();
      }
      // crumbs are printed into the paper (multiply), not pasted on top
      t.globalCompositeOperation = "multiply";
      for (const k of c.crumbs) {
        t.save();
        t.globalAlpha = k.alpha;
        t.translate(Math.round(bx + k.x * DPR), Math.round(by + k.y * DPR));
        t.rotate(k.rot);
        t.scale(k.s * DPR, k.s * DPR);
        t.drawImage(k.img, -k.img.width / 2, -k.img.height / 2);
        t.restore();
      }
      t.globalCompositeOperation = "source-over";
    }
  }
  t.restore();
}

// forget chunks far from the camera so memory stays flat
function pruneChunks() {
  const size = CHUNK;
  const cx = Math.floor((camera.x + W / 2) / size);
  const cy = Math.floor((camera.y + H / 2) / size);
  const keep = Math.ceil(Math.max(W, H) / size) + 3;
  for (const key of chunks.keys()) {
    const [x, y] = key.split(",").map(Number);
    if (Math.abs(x - cx) > keep || Math.abs(y - cy) > keep) chunks.delete(key);
  }
}

// vignette, like the edge of a scanner bed: fixed to the screen
const vignette = document.createElement("canvas");

function buildVignette() {
  vignette.width = canvas.width;
  vignette.height = canvas.height;
  const v = vignette.getContext("2d");
  const cx = vignette.width / 2;
  const cy = vignette.height / 2;
  const r = Math.hypot(cx, cy);
  const g = v.createRadialGradient(cx, cy, r * 0.35, cx, cy, r);
  g.addColorStop(0, "rgba(255,255,255,1)");
  g.addColorStop(1, "rgba(" + [255 - 0.55 * (255 - 92), 255 - 0.55 * (255 - 74), 255 - 0.55 * (255 - 56)].map(Math.round) + ",1)");
  v.fillStyle = g;
  v.fillRect(0, 0, vignette.width, vignette.height);
}

function drawVignette(t) {
  t.globalCompositeOperation = "multiply";
  t.drawImage(vignette, 0, 0);
  t.globalCompositeOperation = "source-over";
}

// Moving film grain drawn over everything, ant included,
// so the ant reads as part of the same print.
const GRAIN_FRAMES = [];
const GRAIN_INTERVAL = 80;
let grainIndex = 0;
let grainTime = 0;

function buildGrain() {
  const rand = makeRng(WORLD_SEED + 1);
  for (let f = 0; f < 4; f++) {
    const c = document.createElement("canvas");
    c.width = c.height = 96;
    const g = c.getContext("2d");
    const img = g.createImageData(96, 96);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const v = rand() < 0.5 ? 20 : 250;
      d[i] = v; d[i + 1] = v - 6; d[i + 2] = v - 14;
      d[i + 3] = Math.floor(rand() * 34);
    }
    g.putImageData(img, 0, 0);
    GRAIN_FRAMES.push(ctx.createPattern(c, "repeat"));
  }
}

function updateGrain(dt) {
  grainTime += dt;
  if (grainTime >= GRAIN_INTERVAL) {
    grainTime = 0;
    grainIndex = (grainIndex + 1) % GRAIN_FRAMES.length;
  }
}

function drawGrain() {
  const scale = 1.5 * DPR;   // grain dots are ~1.5 CSS px
  ctx.save();
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.fillStyle = GRAIN_FRAMES[grainIndex];
  ctx.fillRect(0, 0, canvas.width / scale, canvas.height / scale);
  // very slight exposure flicker
  ctx.globalAlpha = Math.random() * 0.025;
  ctx.fillStyle = "#1e1812";
  ctx.fillRect(0, 0, canvas.width / scale, canvas.height / scale);
  ctx.restore();
}

// ==================================================
// INPUT
// e.code is used so keys work regardless of keyboard
// language (Korean input mode turns e.key "a" into "ㅁ").
// ==================================================

const held = new Set();
const pressed = new Set();

const GAME_KEYS = new Set([
  "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown",
  "KeyA", "KeyD", "KeyW", "KeyS",
  "ShiftLeft", "ShiftRight", "KeyE",
  "KeyK"  // DEBUG: dead animation test only
]);

// Some setups (keyboard remappers, remote desktop, some IMEs) send
// key events with an empty e.code. Fall back to e.key, then keyCode.
const KEY_FALLBACK = {
  arrowleft: "ArrowLeft", arrowright: "ArrowRight",
  arrowup: "ArrowUp", arrowdown: "ArrowDown",
  a: "KeyA", d: "KeyD", w: "KeyW", s: "KeyS", e: "KeyE", k: "KeyK",
  "ㅁ": "KeyA", "ㅇ": "KeyD", "ㅈ": "KeyW", "ㄴ": "KeyS", "ㄷ": "KeyE", "ㅏ": "KeyK",
  shift: "ShiftLeft"
};
const KEYCODE_FALLBACK = {
  37: "ArrowLeft", 38: "ArrowUp", 39: "ArrowRight", 40: "ArrowDown",
  65: "KeyA", 68: "KeyD", 87: "KeyW", 83: "KeyS", 69: "KeyE", 75: "KeyK",
  16: "ShiftLeft"
};

function keyId(e) {
  if (e.code) return e.code;
  return KEY_FALLBACK[(e.key || "").toLowerCase()] || KEYCODE_FALLBACK[e.keyCode] || "";
}

window.addEventListener("keydown", e => {
  const id = keyId(e);
  if (!GAME_KEYS.has(id)) return;
  e.preventDefault();
  if (!held.has(id)) pressed.add(id);
  held.add(id);
});

window.addEventListener("keyup", e => {
  held.delete(keyId(e));
});

window.addEventListener("blur", () => held.clear());

function axis(neg, pos) {
  const n = neg.some(k => held.has(k)) ? 1 : 0;
  const p = pos.some(k => held.has(k)) ? 1 : 0;
  return p - n;
}

// ==================================================
// TOUCH INPUT (mobile)
// Hold a finger anywhere: the ant walks toward it, in any direction.
// Far from the ant = run. A quick tap on the ant = interact.
// No on-screen buttons (GAME_BIBLE §7). A held mouse button works
// the same way, so this can be checked on a desktop too.
// ==================================================

const TOUCH_DEADZONE = 34;      // CSS px around the ant where it stands still
const TOUCH_RUN_RATIO = 0.36;   // finger farther than this x short screen side = run
const TAP_MAX_MS = 260;         // a press shorter than this counts as a tap
const TAP_MAX_MOVE = 12;        // ...if the finger moved less than this (CSS px)
const TAP_ANT_RADIUS = 48;      // tap this close to the ant to interact

const IS_TOUCH = window.matchMedia("(pointer: coarse)").matches;
// phones: the ant moves at half speed, walk and run (director request)
const TOUCH_SPEED_SCALE = 0.5;

const touch = {
  id: null,        // the one pointer that steers; other fingers are ignored
  x: 0, y: 0,      // where it is now (CSS px, screen)
  startX: 0, startY: 0,
  startTime: 0,
  travel: 0        // farthest it got from where it started
};

// the ant's position on screen (the camera keeps it centred)
function antScreen() {
  return [player.x - camera.x, player.y - camera.y];
}

canvas.addEventListener("pointerdown", e => {
  // presses during the title only start / skip the intro
  if (intro.active || touch.id !== null) return;
  if (e.pointerType === "mouse" && e.button !== 0) return;
  e.preventDefault();
  // a click/tap on a sibling is for listening, not walking
  const s = siblingAt(e.clientX, e.clientY);
  if (s && tapSibling(s)) return;
  touch.id = e.pointerId;
  touch.x = touch.startX = e.clientX;
  touch.y = touch.startY = e.clientY;
  touch.startTime = performance.now();
  touch.travel = 0;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
});

canvas.addEventListener("pointermove", e => {
  if (e.pointerId !== touch.id) return;
  touch.x = e.clientX;
  touch.y = e.clientY;
  touch.travel = Math.max(touch.travel,
    Math.hypot(touch.x - touch.startX, touch.y - touch.startY));
});

function endTouch(e) {
  if (e.pointerId !== touch.id) return;
  const quick = performance.now() - touch.startTime < TAP_MAX_MS && touch.travel < TAP_MAX_MOVE;
  const [ax, ay] = antScreen();
  if (e.type === "pointerup" && quick &&
      Math.hypot(touch.startX - ax, touch.startY - ay) < TAP_ANT_RADIUS) {
    pressed.add("KeyE");
  }
  touch.id = null;
}
canvas.addEventListener("pointerup", endTouch);
canvas.addEventListener("pointercancel", endTouch);
canvas.addEventListener("contextmenu", e => e.preventDefault());

// steering from the held finger: [unit x, unit y, running] or null
function touchSteer() {
  if (touch.id === null) return null;
  const [ax, ay] = antScreen();
  const vx = touch.x - ax, vy = touch.y - ay;
  const dist = Math.hypot(vx, vy);
  if (dist < TOUCH_DEADZONE) return null;
  return [vx / dist, vy / dist, dist > Math.min(W, H) * TOUCH_RUN_RATIO];
}

// ==================================================
// PLAYER
// ==================================================

const player = {
  // world position of the BODY anchor
  x: 0,
  y: 0,
  facing: -1,   // -1 = left (sprite default), 1 = right (flipped)
  anim: "idle",
  frame: 0,
  frameTime: 0,
  finished: false,
  running: false,  // picks runInterval when an animation has one
  dirX: 0,         // input direction this frame, 0 when not moving
  dirY: 0
};

function setAnim(name) {
  if (player.anim === name) return;
  player.anim = name;
  player.frame = 0;
  player.frameTime = 0;
  player.finished = false;
}

function updateAnimation(dt) {
  const anim = ANIMATIONS[player.anim];
  const interval = player.running && anim.runInterval ? anim.runInterval : anim.interval;
  player.frameTime += dt;

  while (player.frameTime >= interval) {
    player.frameTime -= interval;
    if (anim.loop) {
      player.frame = (player.frame + 1) % anim.count;
    } else if (player.frame < anim.count - 1) {
      player.frame++;
    } else {
      // hold the last frame for one full interval, then report done
      player.finished = true;
      player.frameTime = 0;
    }
  }
}

// Priority: DEAD > INTERACT > RUN > WALK > IDLE
function updatePlayer(dt) {
  let dx = axis(["ArrowLeft", "KeyA"], ["ArrowRight", "KeyD"]);
  let dy = axis(["ArrowUp", "KeyW"], ["ArrowDown", "KeyS"]);
  let running = held.has("ShiftLeft") || held.has("ShiftRight");
  // keyboard is 8-way: diagonals are scaled so they are not faster
  if (dx !== 0 && dy !== 0) {
    dx *= Math.SQRT1_2;
    dy *= Math.SQRT1_2;
  }
  // a held finger overrides the keys: any angle, already unit length
  const steer = touchSteer();
  if (steer) [dx, dy, running] = steer;
  player.dirX = 0;
  player.dirY = 0;

  // ---- DEAD: final state, ignores all input until page refresh
  if (player.anim === "dead") return;

  // DEBUG: K plays the dead animation for sprite checking only.
  // Not a game mechanic. Remove when a real death trigger exists.
  if (pressed.has("KeyK")) {
    setAnim("dead");
    return;
  }

  // ---- INTERACT: plays once, movement ignored until it finishes
  if (player.anim === "interact") {
    if (player.finished) setAnim("idle");
    else return;
  }
  if (pressed.has("KeyE")) {
    setAnim("interact");
    return;
  }

  // ---- RUN / WALK: any direction on the floor (dx, dy is unit length).
  // Mostly up/down (within ~22° of vertical, same split as the 8 keys)
  // shows the back/front walk cycle; otherwise the side view.
  // Right = mirrored left.
  if (dx !== 0 || dy !== 0) {
    const side = Math.abs(dx) > 0.38;
    if (side) player.facing = Math.sign(dx);
    const speed = (running ? RUN_SPEED : WALK_SPEED) * (IS_TOUCH ? TOUCH_SPEED_SCALE : 1);
    player.x += dx * speed * dt / 1000;
    player.y += dy * speed * dt / 1000;
    player.running = running;
    player.dirX = dx;
    player.dirY = dy;
    if (!side) {
      setAnim(dy < 0 ? "back_walk" : "front_walk");
    } else {
      setAnim(running ? "run" : "walk");
    }
    return;
  }

  // ---- IDLE
  setAnim("idle");
}

// ==================================================
// STAR CANDY (GAME_BIBLE §8, §30)
// One candy, and only a few numbers of state. After 3s of total
// walking it is put just past the screen edge the ant is heading
// for, so the next strip of floor uncovers it. Until it has been on
// screen it may move to wherever the ant now heads; then it stays.
// ==================================================

const CANDY_DELAY = 3000;   // ms of total movement before it exists
const CANDY_SCALE = 0.5;    // about the size of the ant's abdomen
const CANDY_MARGIN = 40;    // CSS px past the screen edge when placed

// Carried on the ant's back once the ant's body touches it.
// Offset of the candy centre from the BODY anchor, in CSS px, for the
// left-facing sprite (mirrored when facing right). From the front the
// candy sits behind the ant and peeks over its head.
const CARRY = {
  idle:       { dx: 27, dy: -17 },
  walk:       { dx: 27, dy: -17 },
  run:        { dx: 27, dy: -17 },
  interact:   { dx: 27, dy: -17 },
  front_walk: { dx: 0,  dy: -26, behind: true },
  turn:       { dx: 0,  dy: -26, behind: true },
  back_walk:  { dx: 0,  dy: -2 }
};

const candy = {
  state: "waiting",   // waiting -> hidden (placed, unseen) -> found -> carried
  moved: 0,
  x: 0,
  y: 0
};

// the ant's body on the floor (world px): its sprite bounds, minus the
// antennae above and the leg tips below and at the ends
function antBodyBox() {
  const anim = ANIMATIONS[player.anim];
  const b = anim.boxes[player.frame];
  const s = SPRITE_SCALE[player.anim];
  const w = b.x1 - b.x0, h = b.y1 - b.y0;
  let l = (b.x0 + w * 0.12 - anim.anchorX) * s;
  let r = (b.x1 - w * 0.12 - anim.anchorX) * s;
  if (player.facing === 1 && !FRONT_BACK.has(player.anim)) [l, r] = [-r, -l];
  return {
    l: player.x + l,
    r: player.x + r,
    t: player.y + (b.y0 + h * 0.3 - anim.anchorY) * s,
    b: player.y + (b.y1 - h * 0.2 - anim.anchorY) * s
  };
}

function antTouchesCandy() {
  const [hw, hh] = candyHalfSize();
  const a = antBodyBox();
  // the candy's bumpy edge is mostly see-through, so use its middle
  return candy.x + hw * 0.8 > a.l && candy.x - hw * 0.8 < a.r &&
         candy.y + hh * 0.8 > a.t && candy.y - hh * 0.8 < a.b;
}

// where the carried candy sits right now (world px)
function carriedPosition() {
  const c = CARRY[player.anim];
  const flip = player.facing === 1 && !FRONT_BACK.has(player.anim);
  return [player.x + (flip ? -c.dx : c.dx), player.y + c.dy];
}

function candyHalfSize() {
  return [starCandyImage.width * CANDY_SCALE / 2, starCandyImage.height * CANDY_SCALE / 2];
}

function placeCandyAhead(dx, dy) {
  const len = Math.hypot(dx, dy);
  const nx = dx / len, ny = dy / len;
  const [hw, hh] = candyHalfSize();
  // distance from the screen centre (the ant) to just past the edge
  const dist = Math.min(
    nx ? (W / 2 + hw) / Math.abs(nx) : Infinity,
    ny ? (H / 2 + hh) / Math.abs(ny) : Infinity) + CANDY_MARGIN;
  candy.x = player.x + nx * dist;
  candy.y = player.y + ny * dist;
}

function candyOnScreen() {
  const [hw, hh] = candyHalfSize();
  return candy.x + hw > camera.x && candy.x - hw < camera.x + W &&
         candy.y + hh > camera.y && candy.y - hh < camera.y + H;
}

function updateCandy(dt) {
  const dx = player.dirX, dy = player.dirY;

  if (candy.state === "carried") {
    if (player.anim === "dead") {
      // it slides off where it was and stays on the floor
      candy.state = "found";
      return;
    }
    [candy.x, candy.y] = carriedPosition();
    return;
  }
  if (candy.state === "found") {
    if (player.anim !== "dead" && antTouchesCandy()) {
      candy.state = "carried";
      [candy.x, candy.y] = carriedPosition();
    }
    return;
  }
  if (dx === 0 && dy === 0) return;

  if (candy.state === "waiting") {
    candy.moved += dt;
    if (candy.moved >= CANDY_DELAY) {
      placeCandyAhead(dx, dy);
      candy.state = "hidden";
    }
    return;
  }

  if (candyOnScreen()) {
    candy.state = "found";
    return;
  }
  // heading somewhere else now: move it ahead again, still off screen
  const vx = candy.x - player.x, vy = candy.y - player.y;
  const cos = (vx * dx + vy * dy) / (Math.hypot(vx, vy) * Math.hypot(dx, dy));
  if (cos < 0.5) placeCandyAhead(dx, dy);
}

// layer: "floor" (lying on the paper), "behind" or "front" (of the ant)
function drawCandy(layer) {
  if (candy.state === "waiting") return;
  const want = candy.state !== "carried" ? "floor"
    : CARRY[player.anim].behind ? "behind" : "front";
  if (want !== layer) return;
  const s = CANDY_SCALE * DPR;
  const x = Math.round(candy.x * DPR) - Math.round(camera.x * DPR);
  const y = Math.round(candy.y * DPR) - Math.round(camera.y * DPR);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.drawImage(starCandyImage, -starCandyImage.width / 2, -starCandyImage.height / 2);
  ctx.restore();
}

// ==================================================
// DRAW
// ==================================================

function drawPlayer() {
  const anim = ANIMATIONS[player.anim];
  const img = anim.images[player.frame];

  // anchor position on screen, snapped to whole device pixels
  const ax = Math.round(player.x * DPR) - Math.round(camera.x * DPR);
  const ay = Math.round(player.y * DPR) - Math.round(camera.y * DPR);
  const s = SPRITE_SCALE[player.anim] * DPR;

  // front/back views are symmetric and never mirrored
  const flip = player.facing === 1 && !FRONT_BACK.has(player.anim);

  ctx.save();
  ctx.translate(ax, ay);
  ctx.scale(flip ? -s : s, s);
  // BODY anchor sits exactly on (player.x, player.y)
  ctx.drawImage(img, -anim.anchorX, -anim.anchorY);
  ctx.restore();
}

// ==================================================
// SIBLINGS (GAME_BIBLE §11, §32, §33)
// Ten siblings, A to J, met one at a time once the ant carries the
// star candy. Each appears just past the screen edge the ant is
// heading for (like the candy). The next one appears only after all
// three of the current one's sets have been heard.
// Numbers and sprites: sprites/siblings/ (tools/make_siblings.py)
// Lines: data/siblings_dialogue.json
// ==================================================

const SIB_MARGIN = 60;      // CSS px past the screen edge when placed
const SIB_NEAR = 170;       // the hero this close is "near" (freeze, retreat)
const SIB_TAP_PAD = 14;     // CSS px of extra room around a sibling for clicks
const SIB_DELAY_FIRST = 3000;  // ms of walking with the candy before A appears
const SIB_DELAY_NEXT = 2000;   // ms of walking after a sibling's last set before the next

let sibData = null;         // siblings.json, with images added
let sibLines = null;        // dialogue, by letter
const siblings = [];        // placed so far, in meeting order
let sibWalked = 0;          // ms walked since the next sibling became due

async function loadSiblings() {
  const [data, talkData] = await Promise.all([
    fetch("sprites/siblings/siblings.json").then(r => r.json()),
    fetch("data/siblings_dialogue.json").then(r => r.json())
  ]);
  for (const a of data.ants) {
    a.images = await Promise.all([1, 2, 3, 4].map(n =>
      loadImage(`sprites/siblings/${a.letter}/walk_0${n}.png`)));
    a.boxes = a.images.map(opaqueBox);
  }
  sibData = data;
  sibLines = talkData.siblings;
}

function sibSpeed(s) {
  return s.def.speed * (IS_TOUCH ? TOUCH_SPEED_SCALE : 1);
}

function sibImage(s) {
  return s.def.images[s.def.sequence[s.step] - 1];
}

// body box of a sibling in world px (sprite bounds, a little trimmed)
function sibBox(s) {
  const b = s.def.boxes[s.def.sequence[s.step] - 1];
  const k = s.def.scale;
  const ax = sibData.anchor.x, ay = sibData.anchor.y;
  let l = (b.x0 - ax) * k, r = (b.x1 - ax) * k;
  if (s.facing === 1) [l, r] = [-r, -l];
  return { l: s.x + l, r: s.x + r, t: s.y + (b.y0 - ay) * k, b: s.y + (b.y1 - ay) * k };
}

function sibOnScreen(s) {
  const b = sibBox(s);
  return b.r > camera.x && b.l < camera.x + W && b.b > camera.y && b.t < camera.y + H;
}

// just past the screen edge in the direction (dx, dy), as for the candy
function placeSiblingAhead(s, dx, dy) {
  const len = Math.hypot(dx, dy);
  const nx = dx / len, ny = dy / len;
  const b = sibBox(s);
  const hw = (b.r - b.l) / 2, hh = (b.b - b.t) / 2;
  const dist = Math.min(
    nx ? (W / 2 + hw) / Math.abs(nx) : Infinity,
    ny ? (H / 2 + hh) / Math.abs(ny) : Infinity) + SIB_MARGIN;
  s.x = s.homeX = player.x + nx * dist;
  s.y = s.homeY = player.y + ny * dist;
}

function spawnSibling(dx, dy) {
  const def = sibData.ants[siblings.length];
  const s = {
    def,
    x: 0, y: 0, homeX: 0, homeY: 0,
    seen: false,
    facing: -1,
    step: 0, stepTime: 0,
    heard: 0,            // sets started (0..3)
    rng: makeRng(WORLD_SEED + def.letter.charCodeAt(0)),
    // movement memory, used differently by each rule
    t: 0, dir: 1, pause: 0, go: 0, tx: null, ty: null, heading: 0
  };
  s.heading = s.rng() * Math.PI * 2;
  placeSiblingAhead(s, dx, dy);
  siblings.push(s);
  return s;
}

function sibDone(s) {
  return s.heard >= 3 && !(talk && talk.sib === s);
}

// ---- movement rules: each returns a direction to walk in, or null to stand

function seek(s, tx, ty, arrive = 4) {
  const vx = tx - s.x, vy = ty - s.y;
  const d = Math.hypot(vx, vy);
  if (d < arrive) return null;
  return [vx / d, vy / d];
}

function wanderTarget(s, radius) {
  const a = s.rng() * Math.PI * 2;
  const r = radius * Math.sqrt(s.rng());
  s.tx = s.homeX + Math.cos(a) * r;
  s.ty = s.homeY + Math.sin(a) * r;
}

function wander(s, dt, radius, pauseMin, pauseMax) {
  if (s.pause > 0) { s.pause -= dt; return null; }
  if (s.tx === null) wanderTarget(s, radius);
  const v = seek(s, s.tx, s.ty);
  if (!v) {
    s.tx = null;
    s.pause = pauseMin + s.rng() * (pauseMax - pauseMin);
  }
  return v;
}

const RULE_STEER = {
  // back and forth over a short stretch, a beat at each end
  pace(s, dt) {
    if (s.pause > 0) { s.pause -= dt; return null; }
    const v = seek(s, s.homeX + s.dir * 110, s.homeY);
    if (!v) { s.dir = -s.dir; s.pause = 600; }
    return v;
  },
  // a long straight line, turning only at the ends, never stopping
  straight(s) {
    const v = seek(s, s.homeX + s.dir * 420, s.homeY, 8);
    if (!v) s.dir = -s.dir;
    return v || [s.dir, 0];
  },
  // a wide steady circle around where it was found
  circle(s, dt) {
    s.t += sibSpeed(s) * dt / 1000 / 130;
    return seek(s, s.homeX + Math.cos(s.t) * 130, s.homeY + Math.sin(s.t) * 130, 1)
      || [-Math.sin(s.t), Math.cos(s.t)];
  },
  // along a line, swinging side to side
  zigzag(s, dt) {
    s.t += dt / 1000;
    const along = s.dir * sibSpeed(s);
    const tx = s.x + along * 0.4;
    const ty = s.homeY + Math.sin(s.t * 3.2) * 55;
    if (Math.abs(s.x - s.homeX) > 320 && Math.sign(s.x - s.homeX) === s.dir) s.dir = -s.dir;
    return seek(s, tx, ty, 0.5);
  },
  // nowhere in particular, slowly
  wander(s, dt) {
    return wander(s, dt, 220, 500, 1800);
  },
  // a few steps, a stop, a few steps
  stop_go(s, dt) {
    s.go -= dt;
    if (s.go < -1300) s.go = 900;           // stopped long enough: go again
    if (s.go <= 0) return null;
    return wander(s, dt, 260, 0, 0);
  },
  // means to go straight, keeps curving one way
  veer(s, dt) {
    s.heading += 0.3 * dt / 1000 * (1 + 0.4 * Math.sin(s.t += dt / 700));
    return [Math.cos(s.heading), Math.sin(s.heading)];
  },
  // wanders, but goes still when the hero comes close
  freeze(s, dt) {
    if (Math.hypot(player.x - s.x, player.y - s.y) < SIB_NEAR) return null;
    return wander(s, dt, 200, 400, 1400);
  },
  // wanders, but backs away (still facing the hero) when the hero comes close
  retreat(s, dt) {
    const vx = s.x - player.x, vy = s.y - player.y;
    const d = Math.hypot(vx, vy);
    if (d < SIB_NEAR) {
      s.tx = null;
      return [vx / d, vy / d];
    }
    return wander(s, dt, 200, 600, 2000);
  },
  // keeps the hero in reach, never too close
  follow(s) {
    const d = Math.hypot(player.x - s.x, player.y - s.y);
    if (d < 120 || (d < 170 && !s.go)) { s.go = 0; return null; }
    s.go = 1;
    return seek(s, player.x, player.y, 120);
  }
};

function updateSiblings(dt) {
  if (!sibData) return;

  // next sibling: once the candy is on the ant's back and the last
  // sibling has said all three sets
  const last = siblings[siblings.length - 1];
  const moving = player.dirX !== 0 || player.dirY !== 0;
  if (candy.state === "carried" && siblings.length < sibData.ants.length &&
      (!last || sibDone(last)) && moving) {
    // like the candy: only walking time counts, standing still does not
    sibWalked += dt;
    if (sibWalked >= (last ? SIB_DELAY_NEXT : SIB_DELAY_FIRST)) {
      spawnSibling(player.dirX, player.dirY);
      sibWalked = 0;
    }
  }

  for (const s of siblings) {
    if (!s.seen) {
      if (sibOnScreen(s)) {
        s.seen = true;
        s.homeX = s.x;
        s.homeY = s.y;
      } else if (moving) {
        // heading somewhere else now: move it ahead again, still off screen
        const vx = s.x - player.x, vy = s.y - player.y;
        const cos = (vx * player.dirX + vy * player.dirY) /
          (Math.hypot(vx, vy) * Math.hypot(player.dirX, player.dirY));
        if (cos < 0.5) placeSiblingAhead(s, player.dirX, player.dirY);
      }
      continue;   // waits where it is until found
    }

    // talking: stands still and faces the hero
    let v = null;
    if (talk && talk.sib === s) {
      s.facing = player.x > s.x ? 1 : -1;
    } else {
      v = RULE_STEER[s.def.rule](s, dt);
    }

    if (v) {
      const sp = sibSpeed(s) * dt / 1000;
      s.x += v[0] * sp;
      s.y += v[1] * sp;
      if (s.def.rule === "retreat" && Math.hypot(player.x - s.x, player.y - s.y) < SIB_NEAR + 20) {
        s.facing = player.x > s.x ? 1 : -1;   // backing away, eyes on the hero
      } else if (Math.abs(v[0]) > 0.2) {
        s.facing = v[0] > 0 ? 1 : -1;
      }
      // its own gait: frame count and how long each step is held
      s.stepTime += dt;
      while (s.stepTime >= s.def.intervals[s.step]) {
        s.stepTime -= s.def.intervals[s.step];
        s.step = (s.step + 1) % s.def.sequence.length;
      }
    } else {
      s.step = 0;
      s.stepTime = 0;
    }
  }
}

function drawSibling(s) {
  const img = sibImage(s);
  const ax = Math.round(s.x * DPR) - Math.round(camera.x * DPR);
  const ay = Math.round(s.y * DPR) - Math.round(camera.y * DPR);
  const k = s.def.scale * DPR;
  ctx.save();
  ctx.translate(ax, ay);
  ctx.scale(s.facing === 1 ? -k : k, k);
  ctx.drawImage(img, -sibData.anchor.x, -sibData.anchor.y);
  ctx.restore();
}

function drawSiblings() {
  for (const s of siblings) if (s.seen || sibOnScreen(s)) drawSibling(s);
}

// a sibling under a click/tap (screen CSS px), nearest first
function siblingAt(cx, cy) {
  const wx = cx + camera.x, wy = cy + camera.y;
  let best = null, bestD = Infinity;
  for (const s of siblings) {
    if (!s.seen) continue;
    const b = sibBox(s);
    if (wx < b.l - SIB_TAP_PAD || wx > b.r + SIB_TAP_PAD ||
        wy < b.t - SIB_TAP_PAD || wy > b.b + SIB_TAP_PAD) continue;
    const d = Math.hypot(wx - s.x, wy - s.y);
    if (d < bestD) { best = s; bestD = d; }
  }
  return best;
}

// ==================================================
// TALK (GAME_BIBLE §33)
// A click/tap on a sibling plays its next set. Lines come one by one,
// one breath each. The hero never answers.
// A click while lines are still coming shows the rest at once;
// a click after that moves on to the next set.
//
// Four looks, for review. Pick with #ink #label #slip #outline
// (or ?talk=...). Default: ink.
//   ink      no bubble: worn typewriter ink straight on the paper
//   label    no bubble: a specimen label pinned to the ant by a thin line
//   slip     bubble:    a torn paper slip laid on the floor
//   outline  bubble:    a 1-bit ink outline with a stepped tail
// ==================================================

const TALK_STYLES = ["ink", "label", "slip", "outline"];
const TALK_STYLE = (() => {
  const h = location.hash.slice(1);
  const q = new URLSearchParams(location.search).get("talk");
  return TALK_STYLES.includes(h) ? h : TALK_STYLES.includes(q) ? q : "ink";
})();

const TALK_FONT = 22;           // VT323 size, 1 text px = 1 CSS px
const TALK_LINE_GAP = 3;        // CSS px between lines
const TALK_FIRST = 250;         // ms before the first line
const TALK_BREATH = 520;        // ms between lines, plus...
const TALK_PER_CHAR = 34;       // ...this much per character of the line before
const TALK_HOLD = 2600;         // ms the whole set stays after its last line
const TALK_FADE = 700;          // ms to fade out

let talk = null;   // { sib, set, lines, at[], clock, shownAll, end }

// one line of worn typewriter ink at a fixed height so lines share a baseline
function talkLine(str, seed, color = INK) {
  const size = TALK_FONT;
  const font = `${size}px "VT323", monospace`;
  const c = document.createElement("canvas");
  const x = c.getContext("2d");
  x.font = font;
  const w = Math.ceil(x.measureText(str).width) + 2;
  const h = Math.round(size * 0.95) + 2;
  c.width = w;
  c.height = h;
  x.font = font;
  x.fillStyle = "#000";
  x.fillText(str, 0, Math.round(size * 0.72));
  const src = x.getImageData(0, 0, w, h).data;

  // 1-bit: ghost ink 1px down-right, ink on top, then soft knock-outs
  const out = x.createImageData(w, h);
  const d = out.data;
  const on = (px, py) => px >= 0 && py >= 0 && px < w && py < h && src[(py * w + px) * 4 + 3] >= 110;
  for (let py = 0; py < h; py++) {
    for (let px = 0; px < w; px++) {
      const i = (py * w + px) * 4;
      let col = null;
      if (on(px, py)) col = color;
      else if (on(px - 1, py - 1)) col = GHOST;
      if (!col) continue;
      d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = 255;
    }
  }
  const rand = makeRng(seed);
  for (let i = 0; i < d.length; i += 4) {
    if (d[i + 3] && rand() < 0.06) d[i + 3] = 0;
  }
  x.clearRect(0, 0, w, h);
  x.putImageData(out, 0, 0);
  return c;
}

function startTalk(s) {
  const letter = s.def.letter;
  const lines = sibLines[letter].sets[s.heard];
  const at = [];
  let t = TALK_FIRST;
  for (let i = 0; i < lines.length; i++) {
    at.push(t);
    t += TALK_BREATH + TALK_PER_CHAR * lines[i].length;
  }
  talk = {
    sib: s,
    set: s.heard,
    lines: lines.map((str, i) => talkLine(str, letter.charCodeAt(0) * 97 + s.heard * 13 + i)),
    tag: talkLine(letter, letter.charCodeAt(0), CREDIT_INK),
    at,
    clock: 0,
    end: at[at.length - 1] + TALK_HOLD + 40 * lines[lines.length - 1].length
  };
  s.heard++;
}

// returns true if the click was used by a sibling
function tapSibling(s) {
  if (talk && talk.sib === s) {
    const lastAt = talk.at[talk.at.length - 1];
    if (talk.clock < lastAt) {
      // still coming: show the rest now
      const skip = lastAt - talk.clock;
      talk.clock = lastAt;
      talk.end = Math.max(talk.end - skip, lastAt + TALK_HOLD);
      return true;
    }
    if (s.heard < 3) { startTalk(s); return true; }
    return false;
  }
  if (talk) return false;               // someone else is still talking
  if (s.heard >= 3) return false;       // has said all it will say
  startTalk(s);
  return true;
}

function updateTalk(dt) {
  if (!talk) return;
  talk.clock += dt;
  if (talk.clock >= talk.end + TALK_FADE) talk = null;
}

// ---- drawing

function talkVisible() {
  let n = 0;
  while (n < talk.at.length && talk.clock >= talk.at[n]) n++;
  return n;
}

function talkAlpha() {
  return Math.max(0, Math.min(1, 1 - (talk.clock - talk.end) / TALK_FADE));
}

// the block of text (CSS px, screen) for the whole set, so a bubble
// does not grow while lines come in. Above the sibling if it fits,
// else below; never on top of the hero or the candy on its back.
function talkLayout(pad) {
  const s = talk.sib;
  const b = sibBox(s);
  const lw = Math.max(...talk.lines.map(l => l.width));
  const lh = talk.lines[0].height + TALK_LINE_GAP;
  const bw = lw + pad * 2;
  const bh = lh * talk.lines.length - TALK_LINE_GAP + pad * 2;
  const headX = (s.facing === 1 ? b.r - 10 : b.l + 10) - camera.x;
  const sibTop = b.t - camera.y, sibBottom = b.b - camera.y;

  // the hero (and what it carries) on screen, with room around it
  const a = antBodyBox();
  let hero = { l: a.l, r: a.r, t: a.t - 30, b: a.b + 6 };
  if (candy.state === "carried") {
    const [hw, hh] = candyHalfSize();
    hero = { l: Math.min(hero.l, candy.x - hw), r: Math.max(hero.r, candy.x + hw),
             t: Math.min(hero.t, candy.y - hh), b: Math.max(hero.b, candy.y + hh) };
  }
  hero = { l: hero.l - camera.x - 10, r: hero.r - camera.x + 10,
           t: hero.t - camera.y - 10, b: hero.b - camera.y + 10 };

  const clampX = x => Math.max(12, Math.min(W - bw - 12, x));
  const aligned = s.facing === 1 ? headX - bw + 24 : headX - 24;
  const xs = [aligned, hero.r + 8, hero.l - 8 - bw].map(clampX);
  const ys = [sibTop - 18 - bh, sibBottom + 18];
  const hits = (x, y) => x < hero.r && x + bw > hero.l && y < hero.b && y + bh > hero.t;
  let x = xs[0], y = ys[0];
  search:
  for (const cy of ys) {
    if (cy < 12 || cy + bh > H - 12) continue;
    for (const cx of xs) {
      if (!hits(cx, cy)) { x = cx; y = cy; break search; }
    }
  }
  const below = y > sibTop;
  return { x, y, w: bw, h: bh, lh, pad, below,
           headX, headY: below ? sibBottom - 4 : sibTop + 8 };
}

function px(v) { return Math.round(v * DPR); }

function drawTalkLines(L, shown) {
  for (let i = 0; i < shown; i++) {
    const c = talk.lines[i];
    ctx.drawImage(c, px(L.x + L.pad), px(L.y + L.pad + i * L.lh), c.width * DPR, c.height * DPR);
  }
}

// stepped 1-bit line between two points (CSS px), in whole-pixel blocks
function stepLine(x0, y0, x1, y1, color, size = 1) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) / size;
  ctx.fillStyle = color;
  for (let i = 0; i <= n; i++) {
    const t = n ? i / n : 0;
    ctx.fillRect(px(Math.round((x0 + (x1 - x0) * t) / size) * size),
                 px(Math.round((y0 + (y1 - y0) * t) / size) * size),
                 Math.ceil(size * DPR), Math.ceil(size * DPR));
  }
}

const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;

const TALK_DRAW = {
  ink() {
    const L = talkLayout(0);
    drawTalkLines(L, talkVisible());
  },

  label() {
    const L = talkLayout(0);
    const shown = talkVisible();
    // specimen label: letter tag, a rule above and below the lines,
    // and a thin pin from the nearer rule down (or up) to the ant
    const top = L.y - 4, bottom = L.y + L.h + 3;
    stepLine(L.x, top, L.x + L.w, top, rgb(GHOST));
    stepLine(L.x, bottom, L.x + L.w, bottom, rgb(GHOST));
    const pinX = Math.max(L.x + 6, Math.min(L.x + L.w - 6, L.headX));
    const pinY = L.below ? top : bottom;
    stepLine(pinX, pinY, L.headX, L.headY, rgb(CREDIT_INK));
    ctx.fillStyle = rgb(INK);
    ctx.fillRect(px(L.headX) - DPR, px(L.headY) - DPR, 3 * DPR, 3 * DPR);
    const tag = talk.tag;
    ctx.drawImage(tag, px(L.x), px(top - tag.height - 1), tag.width * DPR, tag.height * DPR);
    drawTalkLines(L, shown);
  },

  slip() {
    const L = talkLayout(9);
    const shown = talkVisible();
    const rand = makeRng(talk.sib.def.letter.charCodeAt(0) + talk.set * 31);
    // shadow, slip, torn edge, tail
    ctx.fillStyle = "rgba(60,45,30,0.18)";
    ctx.fillRect(px(L.x + 2), px(L.y + 3), px(L.w), px(L.h));
    ctx.fillStyle = "rgb(229,223,209)";
    ctx.fillRect(px(L.x), px(L.y), px(L.w), px(L.h));
    // torn top and bottom edges: bites out of the slip, 1-2 px
    ctx.fillStyle = "rgb(214,206,190)";
    for (let x = 0; x < L.w; x += 2) {
      const a = Math.floor(rand() * 3), b = Math.floor(rand() * 3);
      if (a) ctx.fillRect(px(L.x + x), px(L.y), px(2), px(a));
      if (b) ctx.fillRect(px(L.x + x), px(L.y + L.h - b), px(2), px(b));
    }
    // a ragged tongue of paper pointing at the ant, edged in faint ink
    const tx = Math.max(L.x + 14, Math.min(L.x + L.w - 14, L.headX));
    const ty = L.below ? L.y : L.y + L.h;
    const len = Math.max(8, Math.min(18, Math.abs(L.headY - ty) - 4));
    for (let i = 0; i < len; i++) {
      const half = 7 * (1 - i / len) + 0.5;
      const cx = tx + (L.headX - tx) * i / (len * 2.2);
      const yy = L.below ? ty - i - 1 : ty + i;
      ctx.fillStyle = rgb(GHOST);
      ctx.fillRect(px(cx - half - 1), px(yy), px(half * 2 + 2), px(1));
      ctx.fillStyle = "rgb(229,223,209)";
      ctx.fillRect(px(cx - half), px(yy), px(half * 2), px(1));
    }
    ctx.fillStyle = rgb(GHOST);
    ctx.fillRect(px(L.x), px(L.y + L.h), px(L.w), DPR);
    drawTalkLines(L, shown);
  },

  outline() {
    const L = talkLayout(9);
    const shown = talkVisible();
    const p = 2;  // outline block size, CSS px
    const ink = rgb(INK);
    const x0 = Math.round(L.x / p) * p, y0 = Math.round(L.y / p) * p;
    const x1 = x0 + Math.round(L.w / p) * p, y1 = y0 + Math.round(L.h / p) * p;
    // faint wash inside so the text sits on something
    ctx.fillStyle = "rgba(240,234,222,0.55)";
    ctx.fillRect(px(x0 + p), px(y0 + p), px(x1 - x0 - p), px(y1 - y0 - p));
    // edges with stepped corners
    stepLine(x0 + p * 2, y0, x1 - p * 2, y0, ink, p);
    stepLine(x0 + p * 2, y1, x1 - p * 2, y1, ink, p);
    stepLine(x0, y0 + p * 2, x0, y1 - p * 2, ink, p);
    stepLine(x1, y0 + p * 2, x1, y1 - p * 2, ink, p);
    ctx.fillStyle = ink;
    for (const [cx, cy] of [[x0 + p, y0 + p], [x1 - p, y0 + p], [x0 + p, y1 - p], [x1 - p, y1 - p]]) {
      ctx.fillRect(px(cx), px(cy), Math.ceil(p * DPR), Math.ceil(p * DPR));
    }
    // stepped tail toward the ant's head
    const below = L.below;
    const ex = Math.max(x0 + 16, Math.min(x1 - 24, L.headX));
    const ey = below ? y0 : y1;
    const tipX = ex + (L.headX > ex ? 6 : -6), tipY = ey + (below ? -12 : 12);
    ctx.fillStyle = "rgb(214,206,190)";
    ctx.fillRect(px(ex + p), px(ey), px(8 - p), Math.ceil(p * DPR));
    stepLine(ex, ey, tipX, tipY, ink, p);
    stepLine(ex + 8, ey, tipX, tipY, ink, p);
    drawTalkLines(L, shown);
  }
};

function drawTalk() {
  if (!talk) return;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha = talkAlpha();
  TALK_DRAW[TALK_STYLE]();
  ctx.restore();
}

// ==================================================
// INTRO TITLE SEQUENCE (GAME_BIBLE §29)
// ?intro=0 skips the intro. Any key or click jumps to the reveal.
// ==================================================

// ink tones from the title concepts page
const INK = [42, 34, 27];
const GHOST = [128, 104, 78];
const CREDIT_INK = [92, 74, 56];

const introEnabled = new URLSearchParams(location.search).get("intro") !== "0";

// title cuts out hard, the credit dissolves into the ant world
// Timed from the start of the music: the title lands on the
// clink at 0.764s. Without music it runs on the frame clock.
const intro = {
  active: introEnabled,
  started: false,       // false until the music (or the fallback clock) starts
  needsGesture: false,  // autoplay was blocked: show the key prompt
  clock: 0,         // ms into the intro: music time, or frame time as fallback
  offset: 0,        // ms added by skipping
  lastMusic: -1,    // last music time seen (ms)
  stall: 0,         // ms the music clock has not moved while playing
  musicLost: false, // music stalled for good: frame clock takes over
  phase: 0,
  time: 0,
  phases: [
    ["blank", 764],
    ["title", 2200],
    ["gap", 1300],
    ["credit", 2100],
    ["reveal", 1000]
  ]
};

// --- 1-bit text masks (same method as intro_concepts.html)

function rasterText(str, family, size) {
  const font = `${size}px "${family}"`;
  const c = document.createElement("canvas");
  const x = c.getContext("2d");
  x.font = font;
  c.width = Math.ceil(x.measureText(str).width + size * 2);
  c.height = size * 2;
  x.font = font;
  x.fillText(str, size * 0.5, Math.round(size * 1.4));
  const d = x.getImageData(0, 0, c.width, c.height).data;

  let minX = c.width, minY = c.height, maxX = -1, maxY = -1;
  for (let y = 0; y < c.height; y++) {
    for (let px = 0; px < c.width; px++) {
      if (d[(y * c.width + px) * 4 + 3] >= 128) {
        minX = Math.min(minX, px); maxX = Math.max(maxX, px);
        minY = Math.min(minY, y); maxY = Math.max(maxY, y);
      }
    }
  }
  const w = maxX - minX + 1, h = maxY - minY + 1;
  const m = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let px = 0; px < w; px++) {
      m[y * w + px] = d[((y + minY) * c.width + px + minX) * 4 + 3] >= 128 ? 1 : 0;
    }
  }
  return { w, h, d: m };
}

// one line of worn print: ghost ink 1px down-right, ink on top,
// then knocked out in soft clumps. Returned at grid resolution.
function inkLine(str, size, wearAmount, seed, color = INK) {
  const m = rasterText(str, "VT323", size);
  const w = m.w + 1, h = m.h + 1;
  const data = new Uint8ClampedArray(w * h * 4);
  const paint = (ox, oy, c) => {
    for (let y = 0; y < m.h; y++) {
      for (let x = 0; x < m.w; x++) {
        if (!m.d[y * m.w + x]) continue;
        const i = ((y + oy) * w + x + ox) * 4;
        data[i] = c[0]; data[i + 1] = c[1]; data[i + 2] = c[2]; data[i + 3] = 255;
      }
    }
  };
  paint(1, 1, GHOST);
  paint(0, 0, color);

  const rand = makeRng(seed);
  const cell = 3;
  const cw = Math.ceil(w / cell) + 1;
  const coarse = new Float32Array(cw * (Math.ceil(h / cell) + 1)).map(() => rand());
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      if (!data[i + 3]) continue;
      const c = coarse[Math.floor(y / cell) * cw + Math.floor(x / cell)];
      if (rand() < wearAmount * c * c * 2.2) data[i + 3] = 0;
    }
  }

  const canvasLine = document.createElement("canvas");
  canvasLine.width = w;
  canvasLine.height = h;
  canvasLine.getContext("2d").putImageData(new ImageData(data, w, h), 0, 0);
  return canvasLine;
}

// --- layers, rebuilt on resize

const paperLayer = document.createElement("canvas");
const titleLayer = document.createElement("canvas");
const creditLayer = document.createElement("canvas");
const revealLayer = document.createElement("canvas");
const promptLayer = document.createElement("canvas");
const scratch = document.createElement("canvas");

function blit(target, src, x, y, pw, ph) {
  const t = target.getContext("2d");
  t.imageSmoothingEnabled = false;
  t.drawImage(src, Math.round(x), Math.round(y), src.width * pw, src.height * ph);
}

function snap(v, pix) {
  return Math.round(v / pix) * pix;
}

// three equal lines: no word outranks another
function layoutTitle(cw, ch) {
  const lines = ["SUGAR /", "HONEY /", "ICED TEA"].map((s, i) => inkLine(s, 36, 0.3, 177 + i));
  const lh = Math.max(...lines.map(l => l.height));
  const gap = Math.round(lh * 0.22);
  const maxW = Math.max(...lines.map(l => l.width));
  const pix = Math.max(1, Math.floor(Math.min(
    ch * 0.9 / (lh * 3 + gap * 2),
    cw * 0.9 / maxW)));
  titleLayer.width = cw;
  titleLayer.height = ch;
  let y = snap((ch - (lh * 3 + gap * 2) * pix) / 2, pix);
  for (const line of lines) {
    blit(titleLayer, line, snap((cw - line.width * pix) / 2, pix), y, pix, pix);
    y += (lh + gap) * pix;
  }
}

function buildIntro() {
  if (!introEnabled) return;
  const cw = canvas.width, ch = canvas.height;

  // the same floor the camera starts on, so the reveal only
  // brings in the ant, crumbs and hairs; the paper itself stays put
  paperLayer.width = cw;
  paperLayer.height = ch;
  const p = paperLayer.getContext("2d");
  drawWorld(p, camera.x, camera.y, false);
  drawVignette(p);

  layoutTitle(cw, ch);

  // creator credit: small, short, same worn ink
  const credit = inkLine("@1300dress", 22, 0.15, 311, CREDIT_INK);
  const cpix = Math.max(1, Math.round(ch * 0.055 / credit.height));
  creditLayer.width = cw;
  creditLayer.height = ch;
  blit(creditLayer, credit,
    snap((cw - credit.width * cpix) / 2, cpix),
    snap((ch - credit.height * cpix) / 2, cpix), cpix, cpix);

  // shown only while the browser waits for a key before sound can play
  const prompt = inkLine(IS_TOUCH ? "TAP TO START" : "PRESS ANY KEY", 16, 0.12, 401, CREDIT_INK);
  const ppix = Math.max(1, Math.round(ch * 0.035 / prompt.height));
  promptLayer.width = cw;
  promptLayer.height = ch;
  blit(promptLayer, prompt,
    snap((cw - prompt.width * ppix) / 2, ppix),
    snap((ch - prompt.height * ppix) / 2, ppix), ppix, ppix);

  revealLayer.width = cw;
  revealLayer.height = ch;
  const rv = revealLayer.getContext("2d");
  rv.drawImage(paperLayer, 0, 0);
  rv.drawImage(creditLayer, 0, 0);

  scratch.width = cw;
  scratch.height = ch;
}

// --- dissolves

const dissolveMask = document.createElement("canvas");
let dissolveCell = 0;
let dissolveThresholds = null;

function prepareMask(cell) {
  if (cell === dissolveCell && dissolveMask.width === Math.ceil(canvas.width / cell)) return;
  dissolveCell = cell;
  dissolveMask.width = Math.ceil(canvas.width / cell);
  dissolveMask.height = Math.ceil(canvas.height / cell);
  const rand = makeRng(WORLD_SEED + 9);
  dissolveThresholds = new Float32Array(dissolveMask.width * dissolveMask.height).map(() => rand());
}

// coarse pixel dissolve: draw src with `amount` (0..1) of its blocks gone
function drawDissolved(src, amount) {
  if (amount <= 0) {
    ctx.drawImage(src, 0, 0);
    return;
  }
  if (amount >= 1) return;

  const cell = Math.round(10 * DPR);
  prepareMask(cell);
  const m = dissolveMask.getContext("2d");
  const img = m.createImageData(dissolveMask.width, dissolveMask.height);
  for (let i = 0; i < dissolveThresholds.length; i++) {
    img.data[i * 4 + 3] = dissolveThresholds[i] >= amount ? 255 : 0;
  }
  m.putImageData(img, 0, 0);

  const s = scratch.getContext("2d");
  s.globalCompositeOperation = "source-over";
  s.clearRect(0, 0, scratch.width, scratch.height);
  s.drawImage(src, 0, 0);
  s.globalCompositeOperation = "destination-in";
  s.imageSmoothingEnabled = false;
  s.drawImage(dissolveMask, 0, 0, dissolveMask.width * cell, dissolveMask.height * cell);
  s.globalCompositeOperation = "source-over";
  ctx.drawImage(scratch, 0, 0);
}

// ==================================================
// MUSIC (GAME_BIBLE §21, §31)
// Restaurant chatter, from the first visit through the SUGAR chapter.
// Streamed by two <audio> elements (never decoded whole into memory)
// that take turns, crossfading at each loop seam.
// ==================================================

const MUSIC_SRC = "audio/restaurant_chatter.m4a";
const MUSIC_VOLUME = 0.5;     // room tone under everything, not a soundtrack
const MUSIC_FADE_IN = 0.15;   // s, only to avoid a click at the very start
const MUSIC_XFADE = 2.0;      // s of overlap at each loop seam
const MUSIC_LOOP_FROM = 2.0;  // s, later passes skip the title clink at 0.8s

const music = {
  players: [new Audio(MUSIC_SRC), new Audio(MUSIC_SRC)],
  current: 0,
  playing: false,   // true once play() has actually succeeded
  failed: false,    // file missing or unplayable: the game runs silent
  stopping: null    // { from, until } while fading out for good
};
for (const a of music.players) {
  a.preload = "auto";
  a.volume = 0;
}
music.players[1].preload = "none";   // fetched only when the first loop ends
music.players[0].addEventListener("error", () => { music.failed = true; });

// must be called from a key/click handler unless autoplay is allowed
function startMusic() {
  if (music.failed) return Promise.reject(new Error("no music"));
  return music.players[0].play().then(() => { music.playing = true; });
}

function musicVolume(t) {
  return MUSIC_VOLUME * Math.min(1, t);
}

function updateMusic() {
  if (!music.playing) return;
  const cur = music.players[music.current];
  const next = music.players[1 - music.current];
  const now = performance.now();

  // fade out for good (end of the SUGAR chapter)
  let master = 1;
  if (music.stopping) {
    master = Math.max(0, (music.stopping.until - now) / (music.stopping.until - music.stopping.from));
    if (master === 0) {
      cur.pause();
      next.pause();
      music.playing = false;
      return;
    }
  }

  // first pass fades in briefly from 0
  const fadeIn = cur.currentTime / MUSIC_FADE_IN;

  // start fetching the other player well before the seam
  if (cur.duration && next.preload === "none" && cur.currentTime >= cur.duration - MUSIC_XFADE - 15) {
    next.preload = "auto";
    next.load();
  }

  if (cur.duration && cur.currentTime >= cur.duration - MUSIC_XFADE) {
    if (next.paused) {
      next.currentTime = MUSIC_LOOP_FROM;
      next.play().catch(() => {});
    }
    // equal-power crossfade
    const t = Math.min(1, (cur.currentTime - (cur.duration - MUSIC_XFADE)) / MUSIC_XFADE);
    cur.volume = MUSIC_VOLUME * master * Math.cos(t * Math.PI / 2);
    next.volume = MUSIC_VOLUME * master * Math.sin(t * Math.PI / 2);
    if (cur.ended || t >= 1) {
      cur.pause();
      music.current = 1 - music.current;
    }
  } else {
    cur.volume = musicVolume(fadeIn) * master;
  }
}

// for the end of the SUGAR chapter (not wired to anything yet)
function stopMusic(ms = 3000) {
  const now = performance.now();
  music.stopping = { from: now, until: now + ms };
}

// a hidden tab pauses the room; it comes back where it was
let pausedByTab = [];
document.addEventListener("visibilitychange", () => {
  if (!music.playing) return;
  if (document.hidden) {
    pausedByTab = music.players.filter(a => !a.paused);
    pausedByTab.forEach(a => a.pause());
  } else {
    pausedByTab.forEach(a => a.play().catch(() => {}));
    pausedByTab = [];
  }
});

// --- intro control

function introElapsed() {
  return intro.clock + intro.offset;
}

// the intro follows the music's own clock so the title lands on the beat;
// if the music never starts or stalls for 1.5s, frame time carries on
function tickIntroClock(dt) {
  const following = music.playing && music.current === 0 && !intro.musicLost;
  const m = music.players[0].currentTime * 1000;
  if (following && m > intro.lastMusic) {
    intro.clock = m;
    intro.lastMusic = m;
    intro.stall = 0;
    return;
  }
  if (following) {
    intro.stall += dt;
    if (intro.stall < 1500) return;   // hold: the music is just catching up
    intro.musicLost = true;
  }
  intro.clock += dt;
}

function beginIntro() {
  intro.started = true;
  intro.clock = 0;
}

// try to start straight away; browsers usually block sound until
// the visitor has pressed something, so then we wait for that
function tryAutoStart() {
  if (!intro.active) {
    // ?intro=0: no title sequence, music still starts on first input
    return;
  }
  startMusic().then(beginIntro, () => {
    if (music.failed) beginIntro();   // no file: run the intro silent
    else intro.needsGesture = true;
  });
}

function onIntroInput() {
  // first key or click is the gesture the browser waits for before sound
  if (!music.playing && !music.failed) startMusic().catch(() => {});
  if (!intro.active) return;
  if (!intro.started) {
    // the clock follows the music once it plays, the frame clock until then
    beginIntro();
    return;
  }
  // later presses skip to the reveal
  const revealAt = intro.phases.slice(0, -1).reduce((sum, [, ms]) => sum + ms, 0);
  const e = introElapsed();
  if (e < revealAt) intro.offset += revealAt - e;
}

window.addEventListener("keydown", onIntroInput);
// iOS Safari only lets sound start when a finger lifts, so touches
// count on pointerup; mouse and pen still count on press
window.addEventListener("pointerdown", e => { if (e.pointerType !== "touch") onIntroInput(); });
window.addEventListener("pointerup", e => { if (e.pointerType === "touch") onIntroInput(); });

function updateIntro(dt) {
  if (!intro.started) return;
  tickIntroClock(dt);
  let e = introElapsed();
  for (let i = 0; i < intro.phases.length; i++) {
    const ms = intro.phases[i][1];
    if (e < ms) {
      intro.phase = i;
      intro.time = e;
      return;
    }
    e -= ms;
  }
  intro.active = false;
}

function drawIntro() {
  const [name, dur] = intro.phases[intro.phase];
  if (name === "reveal") {
    drawDissolved(revealLayer, intro.time / dur);
    return;
  }
  ctx.drawImage(paperLayer, 0, 0);
  // waiting for the first key: a small arcade prompt, blinking
  if (!intro.started && intro.needsGesture && performance.now() % 1200 < 750) {
    ctx.drawImage(promptLayer, 0, 0);
  }
  if (name === "title") ctx.drawImage(titleLayer, 0, 0);
  if (name === "credit") ctx.drawImage(creditLayer, 0, 0);
}

// ==================================================
// LOOP
// ==================================================

let lastTime = 0;

function loop(time) {
  const dt = lastTime ? Math.min(time - lastTime, 100) : 0;
  lastTime = time;

  // the ant stays put (idle) until the intro has handed over
  updateMusic();
  if (intro.active) updateIntro(dt);
  else updatePlayer(dt);
  pressed.clear();
  updateAnimation(dt);

  updateGrain(dt);

  // camera keeps the ant in the middle of the screen
  camera.x = player.x - W / 2;
  camera.y = player.y - H / 2;
  pruneChunks();
  if (!intro.active) {
    updateCandy(dt);
    updateSiblings(dt);
    updateTalk(dt);
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawWorld(ctx, camera.x, camera.y, true);
  drawCandy("floor");
  drawVignette(ctx);
  drawSiblings();
  drawCandy("behind");
  drawPlayer();
  drawCandy("front");
  drawTalk();
  if (intro.active) drawIntro();
  drawGrain();

  requestAnimationFrame(loop);
}

// Make sure the page has keyboard focus from load, and after any click
canvas.tabIndex = 0;
canvas.style.outline = "none";
canvas.focus();
window.addEventListener("pointerdown", () => canvas.focus());

// Build stamp: lets you confirm in DevTools that the browser is not
// running a cached older index.html
console.info("[SUGAR] build: siblings-01");

// title font; give up after 3s so a slow network never blocks the game
const introFont = Promise.race([
  document.fonts.load('36px "VT323"'),
  new Promise(r => setTimeout(r, 3000))
]);

// siblings are optional: if their files are missing the walk still works
loadSiblings().catch(err => console.warn("[SUGAR] siblings not loaded", err));

Promise.all([loadAnimations(), loadObjects(), introFont])
  .then(() => {
    // initial spawn only; never reset inside the loop
    player.x = 0;
    player.y = 0;
    camera.x = player.x - W / 2;
    camera.y = player.y - H / 2;
    buildGrain();
    buildVignette();
    buildIntro();
    tryAutoStart();
    window.addEventListener("resize", buildVignette);
    window.addEventListener("resize", () => {
      camera.x = player.x - W / 2;
      camera.y = player.y - H / 2;
      buildIntro();
    });
    requestAnimationFrame(loop);
  })
  .catch(err => console.error(err));

// Read-only hooks for automated checks
window.__ant = player;
window.__candy = candy;
window.__siblings = siblings;
window.__talk = () => talk;
</script>

</body>
</html>
